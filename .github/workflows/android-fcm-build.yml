name: Android Firebase APK verification
on:
  push:
    branches: [dev-luka]
    paths:
      - 'android/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/android-fcm-build.yml'
  workflow_dispatch:
jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter packages
        run: flutter pub get
      - name: Analyze Flutter changes
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build Android debug APK
        run: flutter build apk --debug
