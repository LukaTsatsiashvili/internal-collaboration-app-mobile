name: Flutter production compatibility

on:
  push:
    branches: [dev-luka]
    paths:
      - 'lib/**'
      - 'test/**'
      - '.vscode/launch.json'
      - 'android/app/src/debug/AndroidManifest.xml'
      - '.github/workflows/auth-tests.yml'
  workflow_dispatch:

jobs:
  flutter-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Dart
        run: flutter analyze --no-fatal-infos
      - name: Native auth and HTTPS spreadsheet regressions
        run: flutter test test/auth_reconnect_test.dart test/auth_session_test.dart test/spreadsheet_editor_url_test.dart
      - name: Full Flutter test suite
        run: flutter test
