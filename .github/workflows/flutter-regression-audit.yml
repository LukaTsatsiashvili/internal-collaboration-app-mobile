name: Flutter regression baseline (audit)
on:
  push:
    branches:
      - audit/regression-baseline-20261026
  pull_request:
    branches:
      - dev-luka
  workflow_dispatch:
jobs:
  focused-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Dart (record legacy lints)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Chat read receipts and realtime regression tests
        run: flutter test test/chat_unread_presence_test.dart test/chat_realtime_test.dart --reporter expanded
  full-suite-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Full widget and unit suite (record pre-existing failures)
        continue-on-error: true
        run: flutter test --reporter expanded
